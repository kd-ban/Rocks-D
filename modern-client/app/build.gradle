plugins {
    id 'com.android.application'
}

android {
    namespace 'com.domtokima.paddvn'
    compileSdk 35

    defaultConfig {
        applicationId 'com.domtokima.paddvn'
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName '2.0.0-arm64'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}
