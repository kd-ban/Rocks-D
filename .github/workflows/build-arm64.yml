name: Build Rocks-D ARM64

on:
  push:
    paths:
      - 'modern-client/**'
      - '.github/workflows/build-arm64.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rocks-D
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Import original game assets
        run: |
          test -f Rocks-D-private-server-UNSIGNED.apk
          rm -rf /tmp/rocksd-original modern-client/app/src/main/assets/original modern-client/app/src/main/assets/decrypted
          mkdir -p /tmp/rocksd-original modern-client/app/src/main/assets/original modern-client/app/src/main/assets/decrypted
          unzip -q Rocks-D-private-server-UNSIGNED.apk 'assets/*' -d /tmp/rocksd-original
          cp -a /tmp/rocksd-original/assets/. modern-client/app/src/main/assets/original/
          test -d assets/images
          test -d assets/ccbResources
          cp -a assets/. modern-client/app/src/main/assets/original/
          test -f modern-client/app/src/main/assets/original/lua/SSO/sso.op
          test -f modern-client/app/src/main/assets/original/lua/util/netWork.op
          test -d modern-client/app/src/main/assets/original/images

      - name: Merge optional complete missing assets
        run: |
          if [ -f missing-assets/Rocks-D-missing-assets-ALL.zip ]; then
            rm -rf /tmp/rocksd-missing
            mkdir -p /tmp/rocksd-missing
            unzip -q missing-assets/Rocks-D-missing-assets-ALL.zip -d /tmp/rocksd-missing
            if [ -d /tmp/rocksd-missing/assets ]; then
              cp -an /tmp/rocksd-missing/assets/. modern-client/app/src/main/assets/original/
            else
              cp -an /tmp/rocksd-missing/. modern-client/app/src/main/assets/original/
            fi
          fi
          echo "Original asset count: $(find modern-client/app/src/main/assets/original -type f | wc -l)"

      - name: Import Cocos2d-x 2.1.4 source
        run: |
          rm -rf /tmp/cocos2d-x-2.1.4 /tmp/cocos214.tar.gz
          curl -L --fail --retry 3 https://github.com/cocos2d/cocos2d-x/archive/refs/tags/cocos2d-x-2.1.4.tar.gz -o /tmp/cocos214.tar.gz
          tar -xzf /tmp/cocos214.tar.gz -C /tmp
          ENGINE_DIR="$(find /tmp -maxdepth 1 -type d -name 'cocos2d-x-*2.1.4*' | head -n1)"
          test -n "$ENGINE_DIR"
          test -d "$ENGINE_DIR/cocos2dx"
          test -d "$ENGINE_DIR/scripting/lua"
          rm -rf modern-client/engine/cocos2d-x-2.1.4
          mkdir -p modern-client/engine
          cp -a "$ENGINE_DIR" modern-client/engine/cocos2d-x-2.1.4
          echo "Cocos files: $(find modern-client/engine/cocos2d-x-2.1.4 -type f | wc -l)"

      - name: Decrypt original conf.op
        run: |
          CONF="$(find modern-client/app/src/main/assets/original -type f -iname 'conf.op' | head -n 1)"
          test -n "$CONF"
          python3 - "$CONF" <<'PY'
          import pathlib, subprocess, sys
          src_path = pathlib.Path(sys.argv[1])
          data = src_path.read_bytes()
          n = max(0, (len(data)//8 - 1) * 8)
          head, tail = data[:n], data[n:]
          if head:
              p = subprocess.run(['openssl','enc','-d','-des-ecb','-K','a5320f8e5957633d','-nopad','-provider','legacy','-provider','default'], input=head, stdout=subprocess.PIPE, stderr=subprocess.PIPE, check=True)
              plain = p.stdout + tail
          else:
              plain = tail
          out = pathlib.Path('modern-client/app/src/main/assets/decrypted/conf.lua')
          out.write_bytes(plain)
          print('decrypted bytes:', len(data), '->', len(plain))
          PY
          test -s modern-client/app/src/main/assets/decrypted/conf.lua

      - name: Verify critical game data
        run: |
          test -f modern-client/app/src/main/assets/original/lua/conf.op
          test -f modern-client/app/src/main/assets/original/lua/SSO/sso.op
          test -f modern-client/app/src/main/assets/original/lua/util/netWork.op
          test -f modern-client/app/src/main/assets/decrypted/conf.lua
          test -d modern-client/app/src/main/assets/original/ccbResources
          test -d modern-client/app/src/main/assets/original/images
          test -d modern-client/app/src/main/assets/original/audio
          test -d modern-client/engine/cocos2d-x-2.1.4/cocos2dx
          test -d modern-client/engine/cocos2d-x-2.1.4/scripting/lua

      - name: Import Lua 5.1.5 runtime
        run: |
          rm -rf /tmp/lua-5.1.5 modern-client/app/src/main/cpp/lua
          curl -L --fail --retry 3 https://www.lua.org/ftp/lua-5.1.5.tar.gz -o /tmp/lua-5.1.5.tar.gz
          tar -xzf /tmp/lua-5.1.5.tar.gz -C /tmp
          mkdir -p modern-client/app/src/main/cpp/lua
          cp -a /tmp/lua-5.1.5/src/. modern-client/app/src/main/cpp/lua/
          test -f modern-client/app/src/main/cpp/lua/lua.h

      - name: Import libpng ARM64 source
        run: |
          rm -rf /tmp/libpng-1.6.43 /tmp/libpng.tar.gz modern-client/app/src/main/cpp/libpng
          curl -L --fail --retry 3 https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.43.tar.gz -o /tmp/libpng.tar.gz
          tar -xzf /tmp/libpng.tar.gz -C /tmp
          PNG_DIR="$(find /tmp -maxdepth 1 -type d -name 'libpng-*' | head -n1)"
          test -n "$PNG_DIR"
          mkdir -p modern-client/app/src/main/cpp/libpng
          cp -a "$PNG_DIR"/. modern-client/app/src/main/cpp/libpng/
          cp -a "$PNG_DIR"/arm/*.c modern-client/app/src/main/cpp/libpng/
          sed -i 's#"../pngpriv.h"#"pngpriv.h"#g' modern-client/app/src/main/cpp/libpng/arm_init.c modern-client/app/src/main/cpp/libpng/filter_neon_intrinsics.c modern-client/app/src/main/cpp/libpng/palette_neon_intrinsics.c
          if [ ! -f modern-client/app/src/main/cpp/libpng/pnglibconf.h ]; then
            cp modern-client/app/src/main/cpp/libpng/scripts/pnglibconf.h.prebuilt modern-client/app/src/main/cpp/libpng/pnglibconf.h
          fi
          test -f modern-client/app/src/main/cpp/libpng/png.h
          test -f modern-client/app/src/main/cpp/libpng/pnglibconf.h
          test -f modern-client/app/src/main/cpp/libpng/png.c
          test -f modern-client/app/src/main/cpp/libpng/arm_init.c

      - name: Build ARM64 Stage 8.16 APK
        id: build_apk
        working-directory: modern-client
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee ../stage8.16-build.log
          status=${PIPESTATUS[0]}
          echo "gradle_status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Rocks-D-ARM64-stage8.16-build-log
          path: stage8.16-build.log
          if-no-files-found: error

      - name: Fail if Gradle failed
        if: steps.build_apk.outputs.gradle_status != '0'
        run: exit 1

      - name: Rename APK
        run: cp modern-client/app/build/outputs/apk/debug/app-debug.apk Rocks-D-ARM64-stage8.16.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rocks-D-ARM64-stage8.16
          path: Rocks-D-ARM64-stage8.16.apk
          if-no-files-found: error
