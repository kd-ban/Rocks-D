name: Build Rocks-D ARM64

on:
  push:
    paths:
      - 'modern-client/**'
      - '.github/workflows/build-arm64.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Rocks-D
        uses: actions/checkout@v4

      - name: Checkout recovered engine
        uses: actions/checkout@v4
        with:
          repository: kd-ban/one-piece-
          path: recovered-engine

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Import original game assets
        run: |
          test -f Rocks-D-private-server-UNSIGNED.apk
          rm -rf /tmp/rocksd-original modern-client/app/src/main/assets/original
          mkdir -p /tmp/rocksd-original modern-client/app/src/main/assets/original
          unzip -q Rocks-D-private-server-UNSIGNED.apk 'assets/*' -d /tmp/rocksd-original
          cp -a /tmp/rocksd-original/assets/. modern-client/app/src/main/assets/original/
          test -f modern-client/app/src/main/assets/original/lua/SSO/sso.op
          test -f modern-client/app/src/main/assets/original/lua/util/netWork.op

      - name: Import recovered Lua 5.1 runtime
        run: |
          rm -rf modern-client/app/src/main/cpp/lua
          mkdir -p modern-client/app/src/main/cpp/lua
          cp -a recovered-engine/Engine/scripting/lua/lua/. modern-client/app/src/main/cpp/lua/
          test -f modern-client/app/src/main/cpp/lua/lua.h
          test -f modern-client/app/src/main/cpp/lua/lauxlib.c
          echo "Lua runtime imported"

      - name: Build ARM64 Stage 3 APK
        working-directory: modern-client
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp modern-client/app/build/outputs/apk/debug/app-debug.apk Rocks-D-ARM64-stage3.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rocks-D-ARM64-stage3
          path: Rocks-D-ARM64-stage3.apk
          if-no-files-found: error
